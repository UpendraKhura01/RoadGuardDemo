name: roadguard_frontend
description: RoadGuard - Citizen hazard reporting and admin management system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_svg: ^2.0.7
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  
  # Location & Maps
  geolocator: ^10.1.0
  geocoding: 5.0.0
  permission_handler: ^11.0.0
  
  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  
  # Authentication
  jwt_decoder: ^2.0.1
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  path_provider: ^2.1.1
  
  # JSON Serialization
  json_annotation: ^4.8.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
